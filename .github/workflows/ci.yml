name: CI
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
      - run: uv sync --locked --all-extras
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest

  sast:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run bandit -c pyproject.toml -r src -f sarif -o bandit.sarif || true
      - run: uv run bandit -c pyproject.toml -r src
      # Code scanning on a private repo needs GitHub Advanced Security: upload once public.
      - if: always() && github.event.repository.visibility == 'public'
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          sarif_file: bandit.sarif
          category: bandit

  # Posture on its own lab recordings: the hardened hosts must pass the gate, the weak ones must
  # fail it, and the weak findings go to code scanning so the Security tab shows a real report.
  posture:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - name: Gate (hardened passes, weak fails)
        run: |
          for os in ubuntu:linux rocky:linux dc:ad azure:azure; do
            platform="${os#*:}" os="${os%:*}"
            uv run posture audit "$platform" --replay "tests/fixtures/recordings/$os-hardened" --fail-on high
            code=0
            uv run posture audit "$platform" --replay "tests/fixtures/recordings/$os-weak" \
              --fail-on high --sarif "out/$os-weak.sarif" || code=$?
            test "$code" -eq 1
          done
      - if: always() && github.event.repository.visibility == 'public'
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          sarif_file: out/ubuntu-weak.sarif
          category: posture-ubuntu
      - if: always() && github.event.repository.visibility == 'public'
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          sarif_file: out/rocky-weak.sarif
          category: posture-rocky
      - if: always() && github.event.repository.visibility == 'public'
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          sarif_file: out/dc-weak.sarif
          category: posture-dc
      - if: always() && github.event.repository.visibility == 'public'
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          sarif_file: out/azure-weak.sarif
          category: posture-azure

  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
      - run: uv sync --locked
      # Hash-pinned export of uv.lock, so pip-audit needs no resolver.
      - run: uv export --locked --all-groups --all-extras --no-emit-project -o requirements.txt
      - run: uv run pip-audit --strict --disable-pip -r requirements.txt

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: cyclonedx-json
          artifact-name: posture-sbom.cdx.json
