# Domain password and lockout policy (the domain object, read over LDAP).

- id: AD-PWD-001
  title: Domain passwords are at least 14 characters
  platform: ad
  cis: {windows-server-2019: "1.1.4"}
  severity: high
  attack: [T1110.001, T1110.003]
  rationale: >-
    Every domain account can be guessed online against any DC, and every captured hash can be
    cracked offline. Length is what makes both slow; seven characters fall to a laptop in hours.
  check: {fact: domain.min_password_length, op: ge, value: 14}
  remediation:
    text: >-
      Raise "Minimum password length" to 14 in the Default Domain Policy (Computer Configuration >
      Policies > Windows Settings > Security Settings > Account Policies > Password Policy).
      Existing passwords keep working until they are changed.

- id: AD-PWD-002
  title: Domain passwords must meet complexity requirements
  platform: ad
  cis: {windows-server-2019: "1.1.5"}
  severity: medium
  attack: [T1110.001, T1110.003]
  rationale: >-
    Without complexity, users pick dictionary words and names: the first guesses in any
    password spray, where one common password tried against every account is enough.
  check: {fact: domain.password_complexity, op: eq, value: true}
  remediation:
    text: >-
      Enable "Password must meet complexity requirements" in the Default Domain Policy, or move to
      long passphrases with a banned-password list.

- id: AD-PWD-003
  title: Passwords are not stored with reversible encryption
  platform: ad
  cis: {windows-server-2019: "1.1.6"}
  severity: critical
  attack: [T1003.006]
  rationale: >-
    With reversible encryption the DC keeps every password it is given in a form it can turn
    back into cleartext, so anyone who can replicate from it (DCSync) or read its database gets
    the passwords themselves, not just hashes.
  check: {fact: domain.reversible_encryption, op: eq, value: false}
  remediation:
    text: >-
      Disable "Store passwords using reversible encryption" in the Default Domain Policy, then
      have users change their passwords: the setting only stops new cleartext being stored.

- id: AD-PWD-004
  title: Accounts lock out after at most 5 failed logons
  platform: ad
  cis: {windows-server-2019: "1.2.2"}
  severity: high
  attack: [T1110.001, T1110.003]
  rationale: >-
    With no lockout threshold an attacker can try passwords against an account for as long as
    they like. A low threshold caps online guessing at a handful of tries per lockout window.
  check:
    all:
      - {fact: domain.lockout_threshold, op: gt, value: 0}
      - {fact: domain.lockout_threshold, op: le, value: 5}
  remediation:
    text: >-
      Set "Account lockout threshold" to 5 (with a lockout duration and reset counter of 15
      minutes) in the Default Domain Policy.
