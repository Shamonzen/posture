[project]
name = "posture"
version = "1.0.1"
description = "Read-only security posture auditor for Linux, Active Directory and Azure, mapped to CIS and MITRE ATT&CK"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "jinja2>=3.1",
    "pydantic>=2",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
ad = [
    "ldap3>=2.9",
    "pypsrp>=0.8",
]
azure = [
    "azure-identity>=1.19",
    "httpx>=0.28",
]

[project.scripts]
posture = "posture.cli:main"

[dependency-groups]
dev = [
    "bandit[sarif]>=1.8",
    "jsonschema>=4",
    "pip-audit>=2.9",
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["uv_build>=0.8,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# S = flake8-bandit security checks
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["lab: needs the Vagrant lab running (bash lab/lab.sh up, then weak or hardened)"]
addopts = "-m 'not lab'"
